# Habblaud on local Docker.
#
# Start with `npm run docker:up`: the script detects Claude Code accounts on the host and generates
# docker-compose.override.yml (outside version control) with:
#   - READ-ONLY mounts of <account>/projects and <account>/sessions in /claude/<account>/...
#     (never the whole account directory: credentials and configs live there) and of ~/.habblaud/usage
#     (5h/weekly usage captured by statusline tap) in /usage;
#   - for Codex, ONLY <dir>/sessions, <dir>/archived_sessions, and <dir>/thread-writer-locks in
#     /codex/<account>/... (never auth.json, config.toml, history.jsonl, logs, or SQLite databases);
#   - HABBLAUD_CLAUDE_DIRS, HABBLAUD_CODEX_DIRS, HABBLAUD_ACCOUNTS, and HABBLAUD_USAGE_DIR.
# Compose automatically merges the override into any `docker compose ...` run in this directory.
name: habblaud

services:
  habblaud:
    build: .
    image: habblaud:local
    container_name: habblaud
    restart: unless-stopped
    # Transcripts are sensitive: by default the port is published ONLY on host local interface
    # (HABBLAUD_BIND=0.0.0.0 in .env exposes local network; see README).
    ports:
      - "${HABBLAUD_BIND:-127.0.0.1}:${HABBLAUD_PORT:-4747}:4747"
      # Mobile access port (with login) is only published after npm run remote:setup:
      # included by docker-compose.override.yml generated by docker:up.
    volumes:
      - habblaud-data:/data
    # Options that can come from .env (or environment) into the container.
    environment:
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      # Same value as published port above: terminal (and session actions) only binds locally.
      HABBLAUD_BIND: ${HABBLAUD_BIND:-127.0.0.1}
      HABBLAUD_TERMINAL: ${HABBLAUD_TERMINAL:-}
      # 0 disables in-office messaging (sending messages to agents via web page and terminal).
      HABBLAUD_MENSAGENS: ${HABBLAUD_MENSAGENS:-}
      # 0 disables new version checks (checks GitHub releases every 6 h).
      HABBLAUD_UPDATE_CHECK: ${HABBLAUD_UPDATE_CHECK:-}
      HABBLAUD_LANG: ${HABBLAUD_LANG:-}
      # 0 disables Codex sessions in the office.
      HABBLAUD_CODEX: ${HABBLAUD_CODEX:-}
      # 1 enables New agent from office (in Docker, host helper starts session via npm run
      # codex:bridge; the interactive terminal itself does not run inside container).
      HABBLAUD_PTY: ${HABBLAUD_PTY:-}
      # Remote access with login (server/http/remote.ts).
      HABBLAUD_REMOTE_USER: ${HABBLAUD_REMOTE_USER:-}
      HABBLAUD_REMOTE_PASSWORD_HASH: ${HABBLAUD_REMOTE_PASSWORD_HASH:-}
      HABBLAUD_REMOTE_ALLOW: ${HABBLAUD_REMOTE_ALLOW:-}
      HABBLAUD_REMOTE_INSECURE_HTTP: ${HABBLAUD_REMOTE_INSECURE_HTTP:-}
      # Habblaud World (on by default: server.habblaud.com; nothing sent before signup). HABBLAUD_WORLD=0 disables all.
      HABBLAUD_WORLD: ${HABBLAUD_WORLD:-}
      HABBLAUD_WORLD_URL: ${HABBLAUD_WORLD_URL:-}
      HABBLAUD_WORLD_DEV: ${HABBLAUD_WORLD_DEV:-}
    # Host seen from inside container (local Habblaud World server in testing: HABBLAUD_WORLD_URL=
    # http://host.docker.internal:<port> with HABBLAUD_WORLD_DEV=1). On Docker Desktop the name exists; on Linux,
    # host-gateway points it to host. Harmless without World.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hardening: read-only filesystem (except /data and /tmp), no extra capabilities.
    read_only: true
    # In-memory /tmp with cap: without `size` Docker allows up to half host RAM.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Minimal init process: forwards signals and reaps zombie processes.
    init: true

volumes:
  habblaud-data:
